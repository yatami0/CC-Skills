<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理コンソール — ユーザー</title>
<style>
  /* ============================================================
     :root — IBM Carbon(White テーマ)由来トークンの単一の真実
     以降のスタイルは全て var(--…) を参照する
     ============================================================ */
  :root {
    --font-sans: "IBM Plex Sans", "IBM Plex Sans JP", "Helvetica Neue",
                 "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, Arial, sans-serif;
    --font-mono: "IBM Plex Mono", "SFMono-Regular", Menlo, Consolas, monospace;

    /* 背景レイヤー(公式 White テーマ) */
    --background:      #ffffff;
    --layer-01:        #f4f4f4;
    --layer-02:        #ffffff;
    --layer-accent-01: #e0e0e0;
    --field-01:        #f4f4f4;

    /* テキスト */
    --text-primary:     #161616;
    --text-secondary:   #525252;
    --text-helper:      #6f6f6f;
    --text-placeholder: #a8a8a8;
    --text-on-color:    #ffffff;
    --text-disabled:    rgba(22,22,22,0.25);

    /* 罫線 */
    --border-subtle:      #e0e0e0;
    --border-strong:      #8d8d8d;
    --border-interactive: #0f62fe;

    /* アクセント(= interactive / Blue 60)。宣言はここ 1 箇所のみ */
    --color-accent:        #0f62fe;
    --color-accent-hover:  #0353e9;
    --color-accent-active: #002d9c;
    --color-on-accent:     #ffffff;
    --link-primary:        #0f62fe;
    --focus:               #0f62fe;

    /* ステータス(support トークン) */
    --color-danger:  #da1e28;
    --color-success: #24a148;
    --color-warning: #f1c21b;
    --color-info:    #0043ce;

    /* グレースケール(Gray 10–100) */
    --gray-10: #f4f4f4; --gray-20: #e0e0e0; --gray-30: #c6c6c6; --gray-40: #a8a8a8;
    --gray-50: #8d8d8d; --gray-60: #6f6f6f; --gray-70: #525252; --gray-80: #393939;
    --gray-90: #262626; --gray-100:#161616;

    /* タイポ(productive type tokens) */
    --text-caption-01: 12px; --leading-caption-01: 16px; --weight-caption-01: 400;
    --text-label-01:   12px; --leading-label-01:   16px; --weight-label-01:   400;
    --text-body-01:    14px; --leading-body-01:    20px; --weight-body-01:    400;
    --text-body-02:    16px; --leading-body-02:    24px; --weight-body-02:    400;
    --text-heading-01: 14px; --leading-heading-01: 20px; --weight-heading-01: 600;
    --text-heading-03: 20px; --leading-heading-03: 28px; --weight-heading-03: 400;
    --text-heading-04: 28px; --leading-heading-04: 36px; --weight-heading-04: 400;

    /* スペーシング(8px mini-unit) */
    --spacing-01: 2px;  --spacing-02: 4px;  --spacing-03: 8px;  --spacing-04: 12px;
    --spacing-05: 16px; --spacing-06: 24px; --spacing-07: 32px; --spacing-08: 40px;
    --spacing-09: 48px; --spacing-10: 64px;

    /* 角丸(Carbon は基本 0) */
    --radius-0: 0;
    --radius-s: 4px;

    /* 影(浮く要素のみ) */
    --shadow-overlay: 0 2px 6px rgba(0,0,0,0.20);

    /* a11y / レイアウト */
    --target-min: 44px;
    --sidenav-width: 256px;
    --panel-width: 480px;

    /* 名前空間トークン(Carbon グレー語彙の範囲内・派生) */
    --overlay-scrim: rgba(22,22,22,0.5);
    --row-hover: #e8e8e8;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: var(--font-sans);
    font-size: var(--text-body-01);
    line-height: var(--leading-body-01);
    color: var(--text-primary);
    background: var(--background);
    -webkit-font-smoothing: antialiased;
  }
  svg { display: block; }

  /* ── アプリ全体: サイドバー | メイン ─────────────────────── */
  .app { display: flex; min-height: 100vh; }

  /* ── サイドバー(起点: ブランド + ナビ + アカウント) ──────── */
  .sidenav {
    width: var(--sidenav-width);
    flex: 0 0 var(--sidenav-width);
    background: var(--layer-01);
    border-right: 1px solid var(--border-subtle);
    display: flex;
    flex-direction: column;
    position: sticky;
    top: 0;
    height: 100vh;
  }
  .sidenav__brand {
    display: flex;
    align-items: center;
    gap: var(--spacing-03);
    height: var(--spacing-09);
    padding: 0 var(--spacing-05);
    border-bottom: 1px solid var(--border-subtle);
    font-size: var(--text-heading-01);
    font-weight: var(--weight-heading-01);
    color: var(--text-primary);
    flex: 0 0 auto;
  }
  .sidenav__brand .mark {
    width: 24px; height: 24px;
    flex: 0 0 auto;
    background: var(--color-accent);
    color: var(--color-on-accent);
    display: inline-flex; align-items: center; justify-content: center;
  }
  .sidenav__nav { flex: 1 1 auto; overflow-y: auto; padding: var(--spacing-03) 0; }
  .sidenav__label {
    padding: var(--spacing-03) var(--spacing-05) var(--spacing-02);
    font-size: var(--text-label-01);
    color: var(--text-helper);
  }
  .sidenav__list { list-style: none; margin: 0; padding: 0; }
  .nav-item {
    display: flex;
    align-items: center;
    gap: var(--spacing-04);
    height: var(--spacing-08);
    padding: 0 var(--spacing-05);
    border-left: 3px solid transparent;
    color: var(--text-secondary);
    cursor: pointer;
    user-select: none;
    font-size: var(--text-body-01);
  }
  .nav-item .nav-ico { color: var(--text-secondary); flex: 0 0 auto; }
  .nav-item .nav-ico svg { width: 18px; height: 18px; }
  .nav-item:hover { background: var(--layer-accent-01); color: var(--text-primary); }
  .nav-item:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
  .nav-item[aria-current="page"] {
    background: var(--background);
    border-left-color: var(--color-accent);
    color: var(--text-primary);
    font-weight: var(--weight-heading-01);
  }
  .nav-item[aria-current="page"] .nav-ico { color: var(--color-accent); }

  .sidenav__user {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: var(--spacing-04);
    padding: var(--spacing-04) var(--spacing-05);
    border-top: 1px solid var(--border-subtle);
  }
  .sidenav__user .ava {
    width: 32px; height: 32px;
    border-radius: 50%;
    flex: 0 0 auto;
    background: var(--gray-20);
    color: var(--text-secondary);
    display: inline-flex; align-items: center; justify-content: center;
    font-size: var(--text-caption-01);
    font-weight: var(--weight-heading-01);
  }
  .sidenav__user .who { display: flex; flex-direction: column; min-width: 0; }
  .sidenav__user .who .nm { font-size: var(--text-body-01); color: var(--text-primary); font-weight: var(--weight-heading-01); }
  .sidenav__user .who .rl { font-size: var(--text-label-01); color: var(--text-helper); }

  /* ── メイン: ヘッダー(検索のみ)+ 一覧 ──────────────────── */
  .main { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }

  .content-header {
    display: flex;
    align-items: center;
    height: var(--spacing-09);
    padding: 0 var(--spacing-05);
    border-bottom: 1px solid var(--border-subtle);
    background: var(--background);
  }
  .search {
    position: relative;
    width: 100%;
    max-width: 480px;
  }
  .search .ico {
    position: absolute;
    left: var(--spacing-05);
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-secondary);
    pointer-events: none;
  }
  .search input {
    width: 100%;
    height: var(--spacing-08);
    border: none;
    background: var(--field-01);
    padding: 0 var(--spacing-05) 0 var(--spacing-09);
    font-family: var(--font-sans);
    font-size: var(--text-body-01);
    color: var(--text-primary);
    border-bottom: 1px solid var(--border-strong);
  }
  .search input::placeholder { color: var(--text-placeholder); }
  .search input:focus { outline: 2px solid var(--focus); outline-offset: -2px; }

  /* ── データテーブル(高密度) ────────────────────────────── */
  .table-wrap { flex: 1 1 auto; width: 100%; overflow: auto; }
  table.data {
    width: 100%;
    border-collapse: collapse;
    font-size: var(--text-body-01);
    background: var(--background);
  }
  table.data thead th {
    position: sticky; top: 0; z-index: 1;
    text-align: left;
    font-size: var(--text-heading-01);
    font-weight: var(--weight-heading-01);
    color: var(--text-primary);
    background: var(--layer-01);
    height: var(--spacing-08);
    padding: 0 var(--spacing-05);
    border-bottom: 1px solid var(--border-subtle);
    white-space: nowrap;
  }
  table.data thead th.col-end { width: 48px; }
  table.data tbody td {
    height: var(--spacing-09);
    padding: 0 var(--spacing-05);
    border-bottom: 1px solid var(--border-subtle);
    color: var(--text-secondary);
    vertical-align: middle;
  }
  table.data tbody tr { cursor: pointer; }
  table.data tbody tr:hover { background: var(--row-hover); }
  table.data tbody tr:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }

  .person { display: flex; align-items: center; gap: var(--spacing-04); }
  .person .ava {
    width: 28px; height: 28px;
    border-radius: 50%;
    flex: 0 0 auto;
    background: var(--gray-20);
    color: var(--text-secondary);
    display: inline-flex; align-items: center; justify-content: center;
    font-size: var(--text-caption-01);
    font-weight: var(--weight-heading-01);
  }
  .person .name { color: var(--text-primary); font-weight: var(--weight-heading-01); }
  .col-email { font-family: var(--font-mono); color: var(--text-secondary); }

  /* ロールタグ(中立) */
  .tag {
    display: inline-flex; align-items: center;
    height: 24px;
    padding: 0 var(--spacing-03);
    background: var(--layer-accent-01);
    color: var(--text-primary);
    font-size: var(--text-label-01);
    white-space: nowrap;
  }
  .tag--admin { background: var(--gray-80); color: var(--text-on-color); }

  /* ステータス(色ドット + ラベル) */
  .status { display: inline-flex; align-items: center; gap: var(--spacing-03); color: var(--text-primary); white-space: nowrap; }
  .status .dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; }
  .status--active   .dot { background: var(--color-success); }
  .status--invited  .dot { background: var(--color-warning); }
  .status--disabled .dot { background: var(--gray-50); }
  .status--disabled { color: var(--text-helper); }

  .muted { color: var(--text-helper); }
  .chev { color: var(--gray-50); }

  /* ── ページネーション ────────────────────────────────────── */
  .pagination {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--spacing-05);
    height: var(--spacing-08);
    padding: 0 var(--spacing-05);
    background: var(--layer-01);
    border-top: 1px solid var(--border-subtle);
    font-size: var(--text-body-01);
    color: var(--text-secondary);
    flex-wrap: wrap;
  }
  .pagination__group { display: flex; align-items: center; gap: var(--spacing-04); }
  .pagination__select select {
    appearance: none; -webkit-appearance: none;
    height: var(--spacing-08);
    border: none;
    background: transparent;
    padding: 0 var(--spacing-07) 0 var(--spacing-04);
    font-family: var(--font-sans);
    font-size: var(--text-body-01);
    color: var(--text-primary);
    border-left: 1px solid var(--border-subtle);
    cursor: pointer;
  }
  .pager-btn {
    width: var(--spacing-08); height: var(--spacing-08);
    display: inline-flex; align-items: center; justify-content: center;
    background: transparent; border: none;
    border-left: 1px solid var(--border-subtle);
    color: var(--text-primary); cursor: pointer;
  }
  .pager-btn:hover:not(:disabled) { background: var(--layer-accent-01); }
  .pager-btn:disabled { color: var(--text-disabled); cursor: not-allowed; }
  .pager-btn:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }

  /* ── 詳細スライドパネル ──────────────────────────────────── */
  .scrim {
    position: fixed; inset: 0;
    background: var(--overlay-scrim);
    opacity: 0; visibility: hidden;
    transition: opacity .12s ease;
    z-index: 50;
  }
  .scrim.open { opacity: 1; visibility: visible; }
  .panel {
    position: fixed;
    top: 0; right: 0;
    height: 100vh;
    width: var(--panel-width);
    max-width: 92vw;
    background: var(--background);
    border-left: 1px solid var(--border-subtle);
    box-shadow: var(--shadow-overlay);
    transform: translateX(100%);
    transition: transform .16s cubic-bezier(.2,0,.38,.9);
    z-index: 60;
    display: flex; flex-direction: column;
  }
  .panel.open { transform: translateX(0); }
  .panel__header {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: var(--spacing-04);
    padding: var(--spacing-05);
    border-bottom: 1px solid var(--border-subtle);
  }
  .panel__title { margin: 0; font-size: var(--text-heading-03); line-height: var(--leading-heading-03); font-weight: var(--weight-heading-01); color: var(--text-primary); }
  .panel__sub { color: var(--text-helper); font-size: var(--text-label-01); }
  .panel__close {
    flex: 0 0 auto;
    width: var(--spacing-08); height: var(--spacing-08);
    background: transparent; border: none;
    color: var(--text-primary); cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .panel__close:hover { background: var(--layer-01); }
  .panel__close:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
  .panel__body { padding: var(--spacing-05); overflow-y: auto; }
  .field-row { padding: var(--spacing-04) 0; border-bottom: 1px solid var(--border-subtle); }
  .field-row__label { display: block; font-size: var(--text-label-01); color: var(--text-helper); margin-bottom: var(--spacing-02); }
  .field-row__value { font-size: var(--text-body-02); color: var(--text-primary); }

  .visually-hidden {
    position: absolute; width: 1px; height: 1px;
    margin: -1px; padding: 0; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }

  /* ── レスポンシブ ────────────────────────────────────────── */
  @media (max-width: 671px) {
    .sidenav { position: fixed; left: 0; top: 0; z-index: 30; transform: translateX(-100%); }
    .col-email { display: none; }
  }
</style>
</head>
<body>

<div class="app">

  <!-- サイドバー(起点): ブランド + ナビ + アカウント -->
  <nav class="sidenav" aria-label="管理データ">
    <div class="sidenav__brand">
      <span class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </span>
      管理コンソール
    </div>

    <div class="sidenav__nav">
      <div class="sidenav__label">管理データ</div>
      <ul class="sidenav__list">
        <li class="nav-item" tabindex="0">
          <span class="nav-ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg></span>
          ダッシュボード
        </li>
        <li class="nav-item" tabindex="0" aria-current="page">
          <span class="nav-ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M5 20a7 7 0 0114 0"/></svg></span>
          ユーザー
        </li>
        <li class="nav-item" tabindex="0">
          <span class="nav-ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h2M8 12h2M8 16h2M14 8h2M14 12h2M14 16h2"/></svg></span>
          組織・部署
        </li>
        <li class="nav-item" tabindex="0">
          <span class="nav-ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"/></svg></span>
          ロール・権限
        </li>
        <li class="nav-item" tabindex="0">
          <span class="nav-ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="4"/><path d="M11 11l8 8M16 16l2-2M19 19l1.5-1.5"/></svg></span>
          API キー
        </li>
        <li class="nav-item" tabindex="0">
          <span class="nav-ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg></span>
          監査ログ
        </li>
        <li class="nav-item" tabindex="0">
          <span class="nav-ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2.4"/><circle cx="8" cy="17" r="2.4"/></svg></span>
          設定
        </li>
      </ul>
    </div>

    <div class="sidenav__user">
      <span class="ava" aria-hidden="true">大</span>
      <span class="who">
        <span class="nm">大林 管理者</span>
        <span class="rl">管理者</span>
      </span>
    </div>
  </nav>

  <!-- メイン -->
  <main class="main">
    <h1 class="visually-hidden">ユーザー一覧</h1>

    <!-- ヘッダー: 検索のみ -->
    <div class="content-header">
      <div class="search">
        <span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/></svg></span>
        <input type="search" placeholder="名前・メールで検索" aria-label="ユーザーを検索">
      </div>
    </div>

    <!-- 一覧 -->
    <div class="table-wrap">
      <table class="data">
        <thead>
          <tr>
            <th scope="col">名前</th>
            <th scope="col" class="col-email">メール</th>
            <th scope="col">ロール</th>
            <th scope="col">ステータス</th>
            <th scope="col">最終ログイン</th>
            <th scope="col" class="col-end"><span class="visually-hidden">詳細</span></th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>

    <!-- ページネーション -->
    <div class="pagination">
      <div class="pagination__group">
        <span class="pagination__select">
          <select aria-label="1ページの表示件数">
            <option>25 件</option>
            <option>50 件</option>
            <option>100 件</option>
          </select>
        </span>
        <span>1–25 / 128 件</span>
      </div>
      <div class="pagination__group">
        <span>ページ 1 / 6</span>
        <button class="pager-btn" aria-label="前のページ" disabled>‹</button>
        <button class="pager-btn" aria-label="次のページ">›</button>
      </div>
    </div>
  </main>
</div>

<!-- 詳細スライドパネル -->
<div class="scrim" id="scrim"></div>
<aside class="panel" id="panel" aria-hidden="true" aria-label="ユーザー詳細">
  <div class="panel__header">
    <div>
      <h2 class="panel__title" id="p-name">—</h2>
      <span class="panel__sub" id="p-id">—</span>
    </div>
    <button class="panel__close" id="panelClose" aria-label="詳細を閉じる">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="panel__body">
    <div class="field-row"><span class="field-row__label">メールアドレス</span><span class="field-row__value" id="p-email">—</span></div>
    <div class="field-row"><span class="field-row__label">ロール</span><span class="field-row__value" id="p-role">—</span></div>
    <div class="field-row"><span class="field-row__label">ステータス</span><span class="field-row__value" id="p-status">—</span></div>
    <div class="field-row"><span class="field-row__label">最終ログイン</span><span class="field-row__value" id="p-login">—</span></div>
    <div class="field-row"><span class="field-row__label">作成日</span><span class="field-row__value" id="p-created">—</span></div>
  </div>
</aside>

<script>
  const USERS = [
    { name: "佐藤 健一", initial: "佐", email: "k.sato@example.co.jp",      role: "管理者", status: "active",   login: "2026/06/27 09:14", created: "2023/04/01", id: "USR-1042" },
    { name: "鈴木 美咲", initial: "鈴", email: "m.suzuki@example.co.jp",    role: "一般",   status: "active",   login: "2026/06/26 18:02", created: "2023/05/12", id: "USR-1043" },
    { name: "高橋 亮",   initial: "高", email: "r.takahashi@example.co.jp", role: "一般",   status: "invited",  login: "—",                created: "2026/06/20", id: "USR-1101" },
    { name: "田中 由紀", initial: "田", email: "y.tanaka@example.co.jp",    role: "管理者", status: "active",   login: "2026/06/27 08:41", created: "2022/11/03", id: "USR-0918" },
    { name: "伊藤 直樹", initial: "伊", email: "n.ito@example.co.jp",       role: "一般",   status: "disabled", login: "2026/03/02 11:20", created: "2021/08/19", id: "USR-0612" },
    { name: "渡辺 彩",   initial: "渡", email: "a.watanabe@example.co.jp",  role: "一般",   status: "active",   login: "2026/06/25 14:33", created: "2024/01/15", id: "USR-1188" },
    { name: "山本 大輔", initial: "山", email: "d.yamamoto@example.co.jp",  role: "一般",   status: "invited",  login: "—",                created: "2026/06/24", id: "USR-1190" },
    { name: "中村 香織", initial: "中", email: "k.nakamura@example.co.jp",  role: "管理者", status: "active",   login: "2026/06/27 07:55", created: "2023/02/28", id: "USR-1009" },
    { name: "小林 翔",   initial: "小", email: "s.kobayashi@example.co.jp", role: "一般",   status: "disabled", login: "2025/12/10 16:48", created: "2022/06/07", id: "USR-0744" },
    { name: "加藤 真衣", initial: "加", email: "m.kato@example.co.jp",      role: "一般",   status: "active",   login: "2026/06/26 22:17", created: "2024/03/30", id: "USR-1205" },
    { name: "吉田 拓海", initial: "吉", email: "t.yoshida@example.co.jp",   role: "一般",   status: "active",   login: "2026/06/26 10:08", created: "2023/09/02", id: "USR-1120" },
    { name: "松本 千夏", initial: "松", email: "c.matsumoto@example.co.jp", role: "一般",   status: "active",   login: "2026/06/25 09:51", created: "2024/05/18", id: "USR-1233" },
    { name: "井上 健太", initial: "井", email: "k.inoue@example.co.jp",     role: "管理者", status: "disabled", login: "2025/11/22 13:40", created: "2021/03/11", id: "USR-0501" },
    { name: "木村 さくら", initial: "木", email: "s.kimura@example.co.jp",  role: "一般",   status: "invited",  login: "—",                created: "2026/06/23", id: "USR-1198" }
  ];

  const STATUS = {
    active:   { label: "有効",   cls: "status--active" },
    invited:  { label: "招待中", cls: "status--invited" },
    disabled: { label: "無効",   cls: "status--disabled" }
  };

  const CHEV = '<span class="chev" aria-hidden="true"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></span>';

  const tbody = document.getElementById("rows");
  USERS.forEach((u) => {
    const s = STATUS[u.status];
    const tagCls = u.role === "管理者" ? "tag tag--admin" : "tag";
    const tr = document.createElement("tr");
    tr.tabIndex = 0;
    tr.setAttribute("role", "button");
    tr.setAttribute("aria-label", u.name + " の詳細を開く");
    tr.innerHTML =
      '<td><span class="person"><span class="ava">' + u.initial + '</span><span class="name">' + u.name + '</span></span></td>' +
      '<td class="col-email">' + u.email + '</td>' +
      '<td><span class="' + tagCls + '">' + u.role + '</span></td>' +
      '<td><span class="status ' + s.cls + '"><span class="dot" aria-hidden="true"></span>' + s.label + '</span></td>' +
      '<td class="' + (u.login === "—" ? "muted" : "") + '">' + u.login + '</td>' +
      '<td>' + CHEV + '</td>';
    tr.addEventListener("click", () => openPanel(u));
    tr.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openPanel(u); } });
    tbody.appendChild(tr);
  });

  const scrim = document.getElementById("scrim");
  const panel = document.getElementById("panel");
  function openPanel(u) {
    document.getElementById("p-name").textContent = u.name;
    document.getElementById("p-id").textContent = u.id;
    document.getElementById("p-email").textContent = u.email;
    document.getElementById("p-role").textContent = u.role;
    document.getElementById("p-status").textContent = STATUS[u.status].label;
    document.getElementById("p-login").textContent = u.login;
    document.getElementById("p-created").textContent = u.created;
    panel.classList.add("open");
    scrim.classList.add("open");
    panel.setAttribute("aria-hidden", "false");
    document.getElementById("panelClose").focus();
  }
  function closePanel() {
    panel.classList.remove("open");
    scrim.classList.remove("open");
    panel.setAttribute("aria-hidden", "true");
  }
  document.getElementById("panelClose").addEventListener("click", closePanel);
  scrim.addEventListener("click", closePanel);
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closePanel(); });
</script>
</body>
</html>
