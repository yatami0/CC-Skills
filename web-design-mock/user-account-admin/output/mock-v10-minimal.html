<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理コンソール — ユーザー</title>
<style>
  /* ============================================================
     :root — Apple HIG(light)ベース + tmp Mobility ブランド上書き
     哲学は Apple のまま。accent をブランド色(コーポレートブルー)へ差し替え。
     System Colors / Dynamic Type は公式値 / spacing・角丸・影は導出。
     以降のスタイルは全て var(--…) を参照する。
     ============================================================ */
  :root {
    --font-sans:
      -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display",
      "Helvetica Neue", "Noto Sans JP", "Hiragino Sans",
      "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;

    /* タイポ: Dynamic Type iOS デフォルト(Large) */
    --text-largetitle: 34px; --leading-largetitle: 41px; --weight-largetitle: 400;
    --text-title1:     28px; --leading-title1:     34px; --weight-title1:     400;
    --text-title2:     22px; --leading-title2:     28px; --weight-title2:     400;
    --text-title3:     20px; --leading-title3:     25px; --weight-title3:     400;
    --text-headline:   17px; --leading-headline:   22px; --weight-headline:   600;
    --text-body:       17px; --leading-body:       22px; --weight-body:       400;
    --text-callout:    16px; --leading-callout:    21px; --weight-callout:    400;
    --text-subhead:    15px; --leading-subhead:    20px; --weight-subhead:    400;
    --text-footnote:   13px; --leading-footnote:   18px; --weight-footnote:   400;
    --text-caption1:   12px; --leading-caption1:   16px; --weight-caption1:   400;

    /* カラー: System Colors / light(背景・ラベル・区切りは Apple のまま) */
    --color-bg:            #FFFFFF;
    --color-bg-secondary:  #F2F2F7;
    --color-surface:       #FFFFFF;

    --color-label:            rgba(0,0,0,1);
    --color-label-secondary:  rgba(60,60,67,0.60);
    --color-label-tertiary:   rgba(60,60,67,0.30);

    --color-separator:        rgba(60,60,67,0.29);
    --color-separator-opaque: #C6C6C8;
    --color-fill:             rgba(120,120,128,0.20);
    --color-fill-strong:      rgba(120,120,128,0.32);

    /* アクセント = tmp コーポレートブルー(ブランド上書き)。宣言はここ 1 箇所のみ */
    --color-accent:        #005fa2;   /* tmp corporate blue */
    --color-accent-hover:  #003a63;   /* tmp navy(押下で沈む) */
    --color-on-accent:     #FFFFFF;
    --color-accent-tint:   rgba(0,95,162,0.12);

    /* ブランド補助色(tmp) */
    --brand-navy:    #003a63;   /* 主色・ブランドマーク */
    --brand-skyblue: #009fe8;   /* 明るいハイライト(任意) */

    /* ステータス(Apple System Colors。機能色としてブランドと非競合) */
    --color-success: #34C759;
    --color-warning: #FF9500;
    --color-danger:  #FF3B30;

    /* グレースケール(systemGray 1–6) */
    --color-gray:  #8E8E93; --color-gray2: #AEAEB2; --color-gray3: #C7C7CC;
    --color-gray4: #D1D1D6; --color-gray5: #E5E5EA; --color-gray6: #F2F2F7;

    /* スペーシング(8pt 基調 / 導出) */
    --space-1: 2px;  --space-2: 4px;  --space-3: 8px;   --space-4: 12px;
    --space-5: 16px; --space-6: 20px; --space-7: 24px;  --space-8: 32px;
    --space-9: 40px; --space-10: 48px; --space-11: 64px; --space-12: 80px;

    /* 角丸(iOS 連続角丸の近似 / 導出) */
    --radius-s: 8px;
    --radius-m: 12px;
    --radius-l: 18px;
    --radius-xl: 28px;
    --radius-pill: 980px;

    /* 影(控えめ。奥行きは素材/層が主 / 導出) */
    --shadow-1: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
    --shadow-2: 0 8px 30px rgba(0,0,0,0.10);

    /* a11y 下限(不可侵) */
    --touch-min: 44px;

    /* レイアウト */
    --sidebar-width: 264px;
    --panel-width: 460px;

    /* 名前空間トークン(Apple 派生の補助。本体トークンは非改変) */
    --scrim:        rgba(0,0,0,0.40);
    --fill-success: rgba(52,199,89,0.16);
    --fill-warning: rgba(255,149,0,0.16);
    --fill-neutral: rgba(120,120,128,0.14);
    --row-hover:    rgba(120,120,128,0.08);
    /* 列見出し帯: キャンバスの systemGray6(#F2F2F7)とは被らせない。
       極薄オフホワイト(Ant headerBg #fafafa / Primer #f6f8fa 相当)。必ず地より明るく保つ。
       sticky 見出しのため不透明 solid(半透明だとスクロール行が透ける) */
    --thead-bg:     #FAFAFA;

    /* サイドバー on-dark トークン(濃紺ゾーン限定。範囲限定ブランド上書き) */
    --sidebar-bg:          #003a63;            /* tmp navy */
    --sidebar-fg:          rgba(255,255,255,0.92);
    --sidebar-fg-dim:      rgba(255,255,255,0.60);
    --sidebar-fill:        rgba(255,255,255,0.10);
    --sidebar-fill-strong: rgba(255,255,255,0.16);
    --sidebar-border:      rgba(255,255,255,0.16);
    --sidebar-accent:      #009fe8;            /* tmp skyblue(選択アイコン) */
    /* 選択ハイライト(インセット角丸塗り。左バーは使わない)。案ごとにこの 1 行を差し替える */
    --sidebar-sel:         rgba(255,255,255,0.06);   /* minimal: 白6%(ほぼ地のまま・白太字で示す / Vercel 流) */
    /* スクロールバー(細・半透明白・ホバーで出現) */
    --sidebar-scroll:       rgba(255,255,255,0.24);
    --sidebar-scroll-hover: rgba(255,255,255,0.40);
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: var(--font-sans);
    font-size: var(--text-body);
    line-height: var(--leading-body);
    color: var(--color-label);
    background: var(--color-bg-secondary);
    -webkit-font-smoothing: antialiased;
  }
  svg { display: block; }

  /* ── アプリ: サイドバー | メイン ─────────────────────────── */
  .app { display: flex; height: 100vh; overflow: hidden; }

  /* ── サイドバー(起点 / 濃紺ブランド面・on-dark) ──────────────── */
  .sidebar {
    width: var(--sidebar-width);
    flex: 0 0 var(--sidebar-width);
    background: var(--sidebar-bg);
    color: var(--sidebar-fg);
    display: flex;
    flex-direction: column;
    position: sticky;
    top: 0;
    height: 100vh;
  }
  .sidebar__brand {
    display: flex;
    align-items: center;
    gap: var(--space-3);
    height: 64px;
    padding: 0 var(--space-5);
    font-size: var(--text-headline);
    font-weight: var(--weight-headline);
    color: var(--sidebar-fg);
    flex: 0 0 auto;
  }
  .sidebar__brand .mark {
    width: 28px; height: 28px;
    border-radius: var(--radius-s);
    flex: 0 0 auto;
    background: var(--sidebar-fill-strong);
    color: var(--sidebar-fg);
    display: inline-flex; align-items: center; justify-content: center;
  }
  .sidebar__nav {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: var(--space-3) var(--space-4);
    scrollbar-gutter: stable;
    scrollbar-width: thin;
    scrollbar-color: transparent transparent;   /* 既定は不可視 */
  }
  .sidebar__nav:hover { scrollbar-color: var(--sidebar-scroll) transparent; }
  .sidebar__nav::-webkit-scrollbar { width: 8px; }
  .sidebar__nav::-webkit-scrollbar-track { background-color: transparent; }
  .sidebar__nav::-webkit-scrollbar-thumb {
    background-color: transparent;             /* ホバーまで隠す */
    border-radius: var(--radius-pill);
    border: 2px solid transparent;
    background-clip: padding-box;
  }
  .sidebar__nav:hover::-webkit-scrollbar-thumb { background-color: var(--sidebar-scroll); }
  .sidebar__nav::-webkit-scrollbar-thumb:hover { background-color: var(--sidebar-scroll-hover); }
  .sidebar__label {
    padding: var(--space-3) var(--space-3) var(--space-2);
    font-size: var(--text-footnote);
    color: var(--sidebar-fg-dim);
  }
  .sidebar__list { list-style: none; margin: 0; padding: 0; }
  .nav-item {
    display: flex;
    align-items: center;
    gap: var(--space-4);
    min-height: var(--touch-min);
    padding: var(--space-2) var(--space-4);
    margin-bottom: var(--space-1);
    border-radius: var(--radius-m);
    color: var(--sidebar-fg);
    font-size: var(--text-callout);
    cursor: pointer;
    user-select: none;
  }
  .nav-item .nav-ico { color: var(--sidebar-fg-dim); flex: 0 0 auto; }
  .nav-item .nav-ico svg { width: 22px; height: 22px; }
  .nav-item:hover { background: var(--sidebar-fill); }
  .nav-item:focus-visible { outline: 2px solid var(--sidebar-accent); outline-offset: 2px; }
  .nav-item[aria-current="page"] {
    background: var(--sidebar-fill-strong);
    color: var(--sidebar-fg);
    font-weight: var(--weight-headline);
  }
  .nav-item[aria-current="page"] .nav-ico { color: var(--sidebar-accent); }

  .sidebar__user {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: var(--space-4);
    padding: var(--space-4) var(--space-5);
    border-top: 1px solid var(--sidebar-border);
  }
  .sidebar__user .ava {
    width: 36px; height: 36px;
    border-radius: var(--radius-pill);
    flex: 0 0 auto;
    background: var(--sidebar-fill-strong);
    color: var(--sidebar-fg);
    display: inline-flex; align-items: center; justify-content: center;
    font-size: var(--text-subhead);
    font-weight: var(--weight-headline);
  }
  .sidebar__user .who { display: flex; flex-direction: column; min-width: 0; }
  .sidebar__user .who .nm { font-size: var(--text-subhead); color: var(--sidebar-fg); font-weight: var(--weight-headline); }
  .sidebar__user .who .rl { font-size: var(--text-footnote); color: var(--sidebar-fg-dim); }

  /* ── サイドバー: マスタ・ナビ(~30件フラット + 絞り込み + ピン留め) ──────
     Salesforce Quick Find / AWS 検索 / Stripe Shortcuts の定石を on-dark で実装 */
  .nav-section + .nav-section { margin-top: var(--space-5); }
  .sidebar__label.sub {
    padding: var(--space-3) var(--space-3) var(--space-2);
    font-size: var(--text-caption1);
    letter-spacing: 0.04em;
    color: var(--sidebar-fg-dim);
  }
  /* マスタ見出し+絞り込みは、スクロール時に上端へ固定(Quick Find を常時可視) */
  .nav-masthead {
    position: sticky; top: 0; z-index: 2;
    background: var(--sidebar-bg);
    padding-bottom: var(--space-2);
  }
  .nav-filter { position: relative; padding: 0 var(--space-3); }
  .nav-filter .ico {
    position: absolute; left: calc(var(--space-3) + var(--space-4)); top: 50%;
    transform: translateY(-50%); color: var(--sidebar-fg-dim); pointer-events: none;
  }
  .nav-filter input {
    width: 100%; height: 36px;
    border: none; border-radius: var(--radius-s);
    background: var(--sidebar-fill);
    color: var(--sidebar-fg);
    padding: 0 var(--space-4) 0 var(--space-9);
    font-family: var(--font-sans); font-size: var(--text-subhead);
  }
  .nav-filter input::placeholder { color: var(--sidebar-fg-dim); }
  .nav-filter input:focus { outline: 2px solid var(--sidebar-accent); outline-offset: 1px; }

  /* マスタ項目(テキスト主体・密度高め・アイコン無し) */
  .nav-item.master {
    min-height: 40px;
    padding: var(--space-2) var(--space-4);
    border-radius: var(--radius-s);
    font-size: var(--text-subhead);
    color: var(--sidebar-fg-dim);
  }
  .nav-item.master:hover { color: var(--sidebar-fg); background: var(--sidebar-fill); }
  /* 選択中: インセットの角丸塗りハイライト(左バーは使わない / Notion・Linear・VS Code・Finder の定石) */
  .nav-item.master[aria-current="page"] {
    background: var(--sidebar-sel);
    color: var(--sidebar-fg);
    font-weight: var(--weight-headline);
  }
  .nav-sep { height: 1px; margin: var(--space-3) var(--space-4); background: var(--sidebar-border); }
  .nav-empty { padding: var(--space-4); font-size: var(--text-footnote); color: var(--sidebar-fg-dim); }
  .nav-count { margin-left: auto; font-size: var(--text-caption1); color: var(--sidebar-fg-dim); }

  /* ── メイン: systemGray6 キャンバス + 余白 + カード ─────────── */
  .main {
    flex: 1 1 auto;
    min-width: 0;
    min-height: 0;
    display: flex;
    flex-direction: column;
    background: var(--color-bg-secondary);
    padding: var(--space-7);
    gap: var(--space-7);
  }

  /* ページヘッダー帯: タイトル(=ページ識別)。カード外・キャンバス上に置く
     (Atlassian PageHeader / Polaris Page の定石。"ページ全体" の操作はここ) */
  .page-header {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-5);
    min-height: 36px;
  }
  .page-header h1 {
    margin: 0;
    font-size: var(--text-title2);
    line-height: var(--leading-title2);
    font-weight: var(--weight-headline);
    color: var(--color-label);
  }

  /* カード内ツールバー[B]: 検索ゾーンだけを薄オフホワイトの帯にして差別化。
     列見出し(thead)は素の白で一覧と揃える(ユーザー方針 / Polaris・Carbon) */
  .toolbar {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: var(--space-5);
    padding: var(--space-5) var(--space-7);
    background: var(--thead-bg);
    border-bottom: 1px solid var(--color-separator);
  }
  /* 検索: カード内なので「白＋影」ではなく fill 地に沈める(Apple の検索フィールド作法) */
  .search {
    position: relative;
    flex: 0 1 360px;
    max-width: 360px;
  }
  .search .ico {
    position: absolute;
    left: var(--space-4);
    top: 50%;
    transform: translateY(-50%);
    color: var(--color-label-secondary);
    pointer-events: none;
  }
  .search input {
    width: 100%;
    height: 40px;
    border: none;
    border-radius: var(--radius-m);
    background: var(--color-fill);
    padding: 0 var(--space-5) 0 var(--space-9);
    font-family: var(--font-sans);
    font-size: var(--text-callout);
    color: var(--color-label);
  }
  .search input::placeholder { color: var(--color-label-secondary); }
  .search input:focus { outline: 2px solid var(--color-accent); outline-offset: 1px; }

  /* 一覧カード(白・角丸・微細影。周囲に余白) */
  .card {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
    background: var(--color-surface);
    border-radius: var(--radius-l);
    box-shadow: var(--shadow-1);
    overflow: hidden;
  }

  /* ── 一覧(罫線控えめ + inset セパレータ) ────────────────── */
  .table-wrap { flex: 1 1 auto; width: 100%; overflow: auto; }
  table.list { width: 100%; border-collapse: collapse; font-size: var(--text-subhead); }
  table.list thead th {
    position: sticky; top: 0; z-index: 1;
    text-align: left;
    font-size: var(--text-footnote);
    font-weight: var(--weight-headline);
    letter-spacing: 0.02em;
    color: var(--color-label-secondary);
    padding: var(--space-4) var(--space-7);
    background: var(--color-surface);
    border-bottom: 1px solid var(--color-separator);
    white-space: nowrap;
  }
  table.list thead th.col-end { width: 44px; }
  table.list tbody td {
    padding: var(--space-4) var(--space-7);
    border-bottom: 1px solid var(--color-separator);
    color: var(--color-label-secondary);
    vertical-align: middle;
    height: 60px;
  }
  table.list tbody tr { cursor: pointer; }
  table.list tbody tr:hover { background: var(--row-hover); }
  table.list tbody tr:last-child td { border-bottom: none; }
  table.list tbody tr:focus-visible { outline: 2px solid var(--color-accent); outline-offset: -2px; }

  .person { display: flex; align-items: center; gap: var(--space-4); }
  .person .ava {
    width: 34px; height: 34px;
    border-radius: var(--radius-pill);
    flex: 0 0 auto;
    background: var(--color-fill);
    color: var(--color-label-secondary);
    display: inline-flex; align-items: center; justify-content: center;
    font-size: var(--text-subhead);
    font-weight: var(--weight-headline);
  }
  .person .name { font-size: var(--text-callout); font-weight: var(--weight-headline); color: var(--color-label); }
  .col-email { color: var(--color-label-secondary); }

  /* ロール pill(中立) */
  .pill {
    display: inline-flex; align-items: center;
    height: 26px;
    padding: 0 var(--space-4);
    border-radius: var(--radius-pill);
    background: var(--fill-neutral);
    color: var(--color-label-secondary);
    font-size: var(--text-footnote);
    white-space: nowrap;
  }
  .pill--admin { background: var(--color-fill-strong); color: var(--color-label); font-weight: var(--weight-headline); }

  /* ステータス(tint pill + 色ドット + ラベル) */
  .status {
    display: inline-flex; align-items: center;
    gap: var(--space-3);
    height: 26px;
    padding: 0 var(--space-4);
    border-radius: var(--radius-pill);
    font-size: var(--text-footnote);
    color: var(--color-label);
    white-space: nowrap;
  }
  .status .dot { width: 8px; height: 8px; border-radius: var(--radius-pill); flex: 0 0 auto; }
  .status--active   { background: var(--fill-success); }
  .status--active   .dot { background: var(--color-success); }
  .status--invited  { background: var(--fill-warning); }
  .status--invited  .dot { background: var(--color-warning); }
  .status--disabled { background: var(--fill-neutral); color: var(--color-label-secondary); }
  .status--disabled .dot { background: var(--color-gray); }

  .muted { color: var(--color-label-tertiary); }
  .chev { color: var(--color-label-tertiary); }

  /* ── ページネーション(カード内フッター) ──────────────────── */
  .pagination {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-5);
    padding: var(--space-4) var(--space-7);
    border-top: 1px solid var(--color-separator);
    font-size: var(--text-subhead);
    color: var(--color-label-secondary);
    flex-wrap: wrap;
  }
  .pagination__group { display: flex; align-items: center; gap: var(--space-4); }
  .seg { display: inline-flex; background: var(--color-fill); border-radius: var(--radius-m); padding: var(--space-1); gap: var(--space-1); }
  .seg button {
    min-width: 40px; height: 36px;
    border: none; background: transparent; cursor: pointer;
    border-radius: var(--radius-s);
    color: var(--color-label);
    font-family: var(--font-sans);
    font-size: var(--text-subhead);
  }
  .seg button:hover:not(:disabled) { background: var(--color-surface); }
  .seg button:disabled { color: var(--color-label-tertiary); cursor: not-allowed; }
  .seg button:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 1px; }

  /* ── 詳細スライドシート ──────────────────────────────────── */
  .scrim {
    position: fixed; inset: 0;
    background: var(--scrim);
    opacity: 0; visibility: hidden;
    transition: opacity .2s ease;
    z-index: 50;
  }
  .scrim.open { opacity: 1; visibility: visible; }
  .sheet {
    position: fixed;
    top: 0; right: 0;
    height: 100vh;
    width: var(--panel-width);
    max-width: 92vw;
    background: var(--color-surface);
    border-top-left-radius: var(--radius-xl);
    border-bottom-left-radius: var(--radius-xl);
    box-shadow: var(--shadow-2);
    transform: translateX(100%);
    transition: transform .26s cubic-bezier(.32,.72,0,1);
    z-index: 60;
    display: flex; flex-direction: column;
  }
  .sheet.open { transform: translateX(0); }
  .sheet__header {
    display: flex; align-items: center; gap: var(--space-4);
    padding: var(--space-6);
    border-bottom: 1px solid var(--color-separator);
  }
  .sheet__id { color: var(--color-label-secondary); font-size: var(--text-footnote); }
  .sheet__close {
    margin-left: auto;
    width: var(--touch-min); height: var(--touch-min);
    flex: 0 0 auto;
    border: none;
    border-radius: var(--radius-pill);
    background: var(--color-fill);
    color: var(--color-label-secondary);
    cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .sheet__close:hover { background: var(--color-fill-strong); color: var(--color-label); }
  .sheet__close:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
  .sheet__hero { display: flex; align-items: center; gap: var(--space-5); padding: var(--space-6); }
  .sheet__hero .ava-lg {
    width: 56px; height: 56px;
    border-radius: var(--radius-pill);
    background: var(--brand-navy);
    color: var(--color-on-accent);

    { name:"在庫区分マスタ", prefix:"STK" },
    { name:"取引区分マスタ", prefix:"TRX" }
  ];

  /* 行が未定義のマスタは、共通カラムで体裁の整ったプレースホルダ行を生成 */
  const GEN_POOL = ["東日本","西日本","本社","第一","第二","標準","特例","臨時","国内","予備"];
  function genRows(m) {
    const short = m.name.replace(/マスタ$/, "");
    const seed = m.name.length;
    const out = [];
    for (let j = 0; j < 10; j++) {
      out.push([
        m.prefix + "-" + (1001 + j),
        short + "・" + GEN_POOL[(j + seed) % GEN_POOL.length],
        (j % 2 === 0 ? "標準" : "特別"),
        "2026/0" + ((j % 6) + 1) + "/" + String((j * 3 % 27) + 1).padStart(2, "0"),
        (j % 7 === 0 ? "off" : "on")
      ]);
    }
    return out;
  }

      data: USERS,
      rows: USERS.map((u) => [

        '<span class="' + (u.role === "管理者" ? "pill pill--admin" : "pill") + '">' + u.role + '</span>',

        (u.login === "—" ? '<span class="muted">—</span>' : u.login),
        CHEV
      ])

      ["監査担当","監査ログの閲覧","4","システム","on"],
      ["ゲスト","限定的な閲覧のみ","5","外部","off"]
    ];
    return masterLikeView("権限・ロール", cols, raw);
  }
  function masterView(m) {
    const cols = m.cols || DEFAULT_COLS;
    const raw = m.rows || genRows(m);
    return masterLikeView(m.name, cols, raw);
  }
  function masterLikeView(title, cols, raw) {
    const last = cols.length - 1;
    return {
      title: title,
      columns: cols.map((c) => ({ label: c })),
      clickable: false,
      rows: raw.map((r) => r.map((v, ci) => ci === last ? statusPill(v) : v))
    };
  }

  /* ======================= 描画 ======================= */
  function render(view) {
    pageTitle.textContent = view.title;
    thead.innerHTML = "<tr>" + view.columns.map((c) =>
      "<th scope=\"col\"" + (c.cls ? " class=\"" + c.cls + "\"" : "") + ">" +
      (c.hidden ? '<span class="visually-hidden">' + c.label + "</span>" : c.label) + "</th>"
    ).join("") + "</tr>";

    tbody.innerHTML = "";
    view.rows.forEach((cells, i) => {
      const tr = document.createElement("tr");
      tr.innerHTML = cells.map((html, ci) =>
        "<td" + (view.columns[ci].cls ? " class=\"" + view.columns[ci].cls + "\"" : "") + ">" + html + "</td>"
      ).join("");
      if (view.clickable) {
        const obj = view.data[i];
        tr.tabIndex = 0;
        tr.setAttribute("role", "button");
        tr.setAttribute("aria-label", obj.name + " の詳細を開く");
        tr.addEventListener("click", () => openSheet(obj));
        tr.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openSheet(obj); } });
      }
      tbody.appendChild(tr);
    });

    const n = view.rows.length;
    rangeText.textContent = n ? ("1–" + n + " / " + n + " 件") : "0 件";
    pageText.textContent = "ページ 1 / 1";
    if (rowSearch) rowSearch.value = "";

  const masterList = document.getElementById("masterList");

  const masterItem = (m) => {
    const li = document.createElement("li");
    li.className = "nav-item master";
    li.tabIndex = 0;
    li.dataset.master = m.name;
    li.textContent = m.name;
    return li;
  };

  const navFilter = document.getElementById("navFilter");
  navFilter.addEventListener("input", () => {
    const q = navFilter.value.trim();
    let shown = 0;
    masterList.querySelectorAll(".master").forEach((li) => {
      const hit = li.textContent.includes(q);
      li.hidden = !hit;
      if (hit) shown++;
    });
    navEmpty.hidden = shown > 0;
  });

  /* ======================= 行内検索(現在の一覧を絞り込み) ======================= */
  const rowSearch = document.getElementById("rowSearch");

    document.getElementById("s-email-sub").textContent = u.email;
    document.getElementById("s-email").textContent = u.email;
    document.getElementById("s-role").textContent = u.role;
    document.getElementById("s-status").textContent = STATUS[u.status].label;
    document.getElementById("s-login").textContent = u.login;
    document.getElementById("s-created").textContent = u.created;
    sheet.classList.add("open");
    scrim.classList.add("open");
    sheet.setAttribute("aria-hidden", "false");
    document.getElementById("sheetClose").focus();
  }
  function closeSheet() {
    sheet.classList.remove("open");
    scrim.classList.remove("open");
    sheet.setAttribute("aria-hidden", "true");
  }
  document.getElementById("sheetClose").addEventListener("click", closeSheet);
  scrim.addEventListener("click", closeSheet);
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeSheet(); });

  /* ======================= 初期描画 ======================= */
  render(usersView());
</script>
</body>
</html>
