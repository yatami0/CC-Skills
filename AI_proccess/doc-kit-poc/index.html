<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>doc-kit — Next.js + TanStack Query 構成（page PoC）</title>
    <!-- FOUC 対策: first paint 前に data-theme を確定する blocking script
         （localStorage → prefers-color-scheme の順。next-themes / MUI 方式） -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("doc-kit-theme");
          var theme =
            saved === "light" || saved === "dark"
              ? saved
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          /* private mode 等で localStorage 不可でも既定テーマで続行 */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
