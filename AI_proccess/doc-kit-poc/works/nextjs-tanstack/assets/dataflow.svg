<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 540" width="560" height="540" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="df-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#6b6a66" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="df-arr-loop" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1d9e75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- edges -->
  <g fill="none" stroke="#6b6a66" stroke-width="1.5">
    <path d="M240 72 V104" marker-end="url(#df-arr)"/>
    <path d="M240 160 V192" marker-end="url(#df-arr)"/>
    <path d="M240 248 V280" marker-end="url(#df-arr)"/>
    <path d="M240 336 V368" marker-end="url(#df-arr)"/>
    <path d="M240 424 V456" marker-end="url(#df-arr)"/>
  </g>
  <text x="252" y="356" font-size="12" fill="#6b6a66">HTTP</text>

  <!-- invalidate loop: spring → cache -->
  <path d="M390 484 H460 V220 H398" fill="none" stroke="#1d9e75" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#df-arr-loop)"/>
  <text x="470" y="346" font-size="12" fill="#1d9e75">invalidate</text>
  <text x="470" y="362" font-size="12" fill="#1d9e75">→ 再取得</text>

  <!-- boxes -->
  <g>
    <rect x="90" y="16" width="300" height="56" rx="10" fill="#e6f1fb" stroke="#185fa5" stroke-width="1.5"/>
    <text x="240" y="40" text-anchor="middle" font-size="14" font-weight="600" fill="#0c447c">Client Component</text>
    <text x="240" y="58" text-anchor="middle" font-size="12" fill="#185fa5">一覧 / 詳細 / 更新フォーム</text>
  </g>
  <g>
    <rect x="90" y="104" width="300" height="56" rx="10" fill="#e6f1fb" stroke="#185fa5" stroke-width="1.5"/>
    <text x="240" y="128" text-anchor="middle" font-size="14" font-weight="600" fill="#0c447c">useQuery / useMutation</text>
    <text x="240" y="146" text-anchor="middle" font-size="12" fill="#185fa5">取得・更新・状態管理</text>
  </g>
  <g>
    <rect x="90" y="192" width="300" height="56" rx="10" fill="#e1f5ee" stroke="#0f6e56" stroke-width="1.5"/>
    <text x="240" y="216" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">QueryCache</text>
    <text x="240" y="234" text-anchor="middle" font-size="12" fill="#0f6e56">queryKey 単位で保持</text>
  </g>
  <g>
    <rect x="90" y="280" width="300" height="56" rx="10" fill="#f1efe8" stroke="#5f5e5a" stroke-width="1.5"/>
    <text x="240" y="304" text-anchor="middle" font-size="14" font-weight="600" fill="#444441">生成APIクライアント</text>
    <text x="240" y="322" text-anchor="middle" font-size="12" fill="#5f5e5a">OpenAPIから型付き生成</text>
  </g>
  <g>
    <rect x="90" y="368" width="300" height="56" rx="10" fill="#eeedfe" stroke="#534ab7" stroke-width="1.5"/>
    <text x="240" y="392" text-anchor="middle" font-size="14" font-weight="600" fill="#3c3489">Route Handler（BFF）</text>
    <text x="240" y="410" text-anchor="middle" font-size="12" fill="#534ab7">認証付与・整形</text>
  </g>
  <g>
    <rect x="90" y="456" width="300" height="56" rx="10" fill="#faece7" stroke="#993c1d" stroke-width="1.5"/>
    <text x="240" y="480" text-anchor="middle" font-size="14" font-weight="600" fill="#712b13">Spring Boot</text>
    <text x="240" y="498" text-anchor="middle" font-size="12" fill="#993c1d">REST API / DB</text>
  </g>
</svg>
