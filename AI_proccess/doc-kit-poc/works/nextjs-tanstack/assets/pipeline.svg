<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 650" width="840" height="650" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="pl-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#6b6a66" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- edges -->
  <g fill="none" stroke="#6b6a66" stroke-width="1.5">
    <path d="M420 72 V104" marker-end="url(#pl-arr)"/>
    <path d="M420 160 V192" marker-end="url(#pl-arr)"/>
    <!-- ai fan-out to 5 checks -->
    <path d="M420 248 C 200 270, 96 268, 96 286" marker-end="url(#pl-arr)"/>
    <path d="M420 248 C 300 270, 258 268, 258 286" marker-end="url(#pl-arr)"/>
    <path d="M420 248 V286" marker-end="url(#pl-arr)"/>
    <path d="M420 248 C 540 270, 582 268, 582 286" marker-end="url(#pl-arr)"/>
    <path d="M420 248 C 640 270, 744 268, 744 286" marker-end="url(#pl-arr)"/>
    <!-- drift continues to deploy -->
    <path d="M582 344 V400" marker-end="url(#pl-arr)"/>
    <path d="M582 456 V488" marker-end="url(#pl-arr)"/>
    <path d="M582 544 V576" marker-end="url(#pl-arr)"/>
  </g>

  <!-- boxes: spine -->
  <g>
    <rect x="270" y="16" width="300" height="56" rx="10" fill="#faece7" stroke="#993c1d" stroke-width="1.5"/>
    <text x="420" y="40" text-anchor="middle" font-size="14" font-weight="600" fill="#712b13">① OpenAPIスキーマ</text>
    <text x="420" y="58" text-anchor="middle" font-size="12" fill="#993c1d">Spring Bootが出力</text>
  </g>
  <g>
    <rect x="270" y="104" width="300" height="56" rx="10" fill="#f1efe8" stroke="#5f5e5a" stroke-width="1.5"/>
    <text x="420" y="128" text-anchor="middle" font-size="14" font-weight="600" fill="#444441">型 / APIクライアント / Zod</text>
    <text x="420" y="146" text-anchor="middle" font-size="12" fill="#5f5e5a">自動生成（src/generated）</text>
  </g>
  <g>
    <rect x="270" y="192" width="300" height="56" rx="10" fill="#e6f1fb" stroke="#185fa5" stroke-width="1.5"/>
    <text x="420" y="216" text-anchor="middle" font-size="14" font-weight="600" fill="#0c447c">② AIで実装 + 自己修正ループ</text>
    <text x="420" y="234" text-anchor="middle" font-size="12" fill="#185fa5">AGENTS.md / 型 / lint で拘束</text>
  </g>

  <!-- boxes: 5 CI checks -->
  <g>
    <rect x="21" y="286" width="150" height="56" rx="10" fill="#e6f1fb" stroke="#185fa5" stroke-width="1.5"/>
    <text x="96" y="310" text-anchor="middle" font-size="13" font-weight="600" fill="#0c447c">ローカル検証</text>
    <text x="96" y="328" text-anchor="middle" font-size="11" fill="#185fa5">tsc / Vitest を即実行</text>
  </g>
  <g>
    <rect x="183" y="286" width="150" height="56" rx="10" fill="#eeedfe" stroke="#534ab7" stroke-width="1.5"/>
    <text x="258" y="310" text-anchor="middle" font-size="13" font-weight="600" fill="#3c3489">③ 型 + lint</text>
    <text x="258" y="328" text-anchor="middle" font-size="11" fill="#534ab7">tsc / ESLint</text>
  </g>
  <g>
    <rect x="345" y="286" width="150" height="56" rx="10" fill="#eeedfe" stroke="#534ab7" stroke-width="1.5"/>
    <text x="420" y="310" text-anchor="middle" font-size="13" font-weight="600" fill="#3c3489">単体テスト</text>
    <text x="420" y="328" text-anchor="middle" font-size="11" fill="#534ab7">Vitest</text>
  </g>
  <g>
    <rect x="507" y="286" width="150" height="56" rx="10" fill="#eeedfe" stroke="#534ab7" stroke-width="1.5"/>
    <text x="582" y="310" text-anchor="middle" font-size="13" font-weight="600" fill="#3c3489">drift検出</text>
    <text x="582" y="328" text-anchor="middle" font-size="11" fill="#534ab7">再生成と一致確認</text>
  </g>
  <g>
    <rect x="669" y="286" width="150" height="56" rx="10" fill="#eeedfe" stroke="#534ab7" stroke-width="1.5"/>
    <text x="744" y="310" text-anchor="middle" font-size="13" font-weight="600" fill="#3c3489">build</text>
    <text x="744" y="328" text-anchor="middle" font-size="11" fill="#534ab7">next build</text>
  </g>

  <!-- boxes: deploy column (from drift) -->
  <g>
    <rect x="472" y="400" width="220" height="56" rx="10" fill="#eaf3de" stroke="#3b6d11" stroke-width="1.5"/>
    <text x="582" y="424" text-anchor="middle" font-size="14" font-weight="600" fill="#27500a">④ プレビューデプロイ</text>
    <text x="582" y="442" text-anchor="middle" font-size="12" fill="#3b6d11">本番同等環境</text>
  </g>
  <g>
    <rect x="472" y="488" width="220" height="56" rx="10" fill="#eaf3de" stroke="#3b6d11" stroke-width="1.5"/>
    <text x="582" y="512" text-anchor="middle" font-size="14" font-weight="600" fill="#27500a">Playwright E2E</text>
    <text x="582" y="530" text-anchor="middle" font-size="12" fill="#3b6d11">CRUDハッピーパス</text>
  </g>
  <g>
    <rect x="472" y="576" width="220" height="56" rx="10" fill="#faeeda" stroke="#854f0b" stroke-width="1.5"/>
    <text x="582" y="600" text-anchor="middle" font-size="14" font-weight="600" fill="#633806">⑤ mainマージで本番デプロイ</text>
    <text x="582" y="618" text-anchor="middle" font-size="12" fill="#854f0b">全チェック緑が必須</text>
  </g>
</svg>
