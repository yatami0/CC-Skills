<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 600" width="560" height="600" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="ek-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#6b6a66" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- EKS cluster (背景) -->
  <rect x="70" y="456" width="420" height="120" rx="14" fill="#eef8f4" stroke="#0f6e56" stroke-width="1"/>
  <text x="82" y="476" font-size="12" font-weight="600" fill="#085041">EKS クラスタ ・ 同一クラスタ内</text>

  <!-- edges -->
  <g fill="none" stroke="#6b6a66" stroke-width="1.5">
    <path d="M280 72 V104" marker-end="url(#ek-arr)"/>
    <path d="M280 160 V192" marker-end="url(#ek-arr)"/>
    <path d="M280 248 V280" marker-end="url(#ek-arr)"/>
    <path d="M280 336 V368" marker-end="url(#ek-arr)"/>
    <path d="M280 424 V472 H184 V498" marker-end="url(#ek-arr)"/>
    <path d="M272 526 H296" marker-end="url(#ek-arr)"/>
  </g>
  <text x="292" y="466" font-size="12" fill="#6b6a66">deploy</text>
  <text x="284" y="520" font-size="12" fill="#6b6a66">Service</text>

  <!-- boxes: spine -->
  <g>
    <rect x="100" y="16" width="360" height="56" rx="10" fill="#eeedfe" stroke="#534ab7" stroke-width="1.5"/>
    <text x="280" y="40" text-anchor="middle" font-size="13" font-weight="600" fill="#3c3489">CI: 型+lint / Vitest / drift検出 / build</text>
    <text x="280" y="58" text-anchor="middle" font-size="12" fill="#534ab7">全部緑でないと先へ進めない</text>
  </g>
  <g>
    <rect x="100" y="104" width="360" height="56" rx="10" fill="#e6f1fb" stroke="#185fa5" stroke-width="1.5"/>
    <text x="280" y="128" text-anchor="middle" font-size="14" font-weight="600" fill="#0c447c">standalone ビルド</text>
    <text x="280" y="146" text-anchor="middle" font-size="12" fill="#185fa5">output: standalone</text>
  </g>
  <g>
    <rect x="100" y="192" width="360" height="56" rx="10" fill="#e6f1fb" stroke="#185fa5" stroke-width="1.5"/>
    <text x="280" y="216" text-anchor="middle" font-size="14" font-weight="600" fill="#0c447c">Docker イメージ化</text>
    <text x="280" y="234" text-anchor="middle" font-size="12" fill="#185fa5">マルチステージ / 軽量</text>
  </g>
  <g>
    <rect x="100" y="280" width="360" height="56" rx="10" fill="#f1efe8" stroke="#5f5e5a" stroke-width="1.5"/>
    <text x="280" y="304" text-anchor="middle" font-size="14" font-weight="600" fill="#444441">ECR に push</text>
    <text x="280" y="322" text-anchor="middle" font-size="12" fill="#5f5e5a">tag = git sha</text>
  </g>
  <g>
    <rect x="100" y="368" width="360" height="56" rx="10" fill="#f1efe8" stroke="#5f5e5a" stroke-width="1.5"/>
    <text x="280" y="392" text-anchor="middle" font-size="14" font-weight="600" fill="#444441">kubectl / Helm</text>
    <text x="280" y="410" text-anchor="middle" font-size="12" fill="#5f5e5a">OIDC認証で適用</text>
  </g>

  <!-- pods (cluster 内) -->
  <g>
    <rect x="96" y="498" width="176" height="56" rx="10" fill="#e6f1fb" stroke="#185fa5" stroke-width="1.5"/>
    <text x="184" y="522" text-anchor="middle" font-size="14" font-weight="600" fill="#0c447c">Next.js 用 Pod</text>
    <text x="184" y="540" text-anchor="middle" font-size="12" fill="#185fa5">FE + BFF</text>
  </g>
  <g>
    <rect x="296" y="498" width="176" height="56" rx="10" fill="#faece7" stroke="#993c1d" stroke-width="1.5"/>
    <text x="384" y="522" text-anchor="middle" font-size="14" font-weight="600" fill="#712b13">Spring Boot 用 Pod</text>
    <text x="384" y="540" text-anchor="middle" font-size="12" fill="#993c1d">REST API / DB</text>
  </g>
</svg>
