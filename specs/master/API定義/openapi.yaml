openapi: 3.0.3
info:
  title: Master Service API (placeholder)
  version: 0.0.0
  description: >
    基盤構築用の仮置きスキーマ。backend が正式提供するまでの間、
    OpenAPI codegen パイプライン（orval）を通すためのプレースホルダ。
    実スキーマ確定時に置き換える。
servers:
  - url: /api
    description: BFF キャッチオール proxy（same-origin）経由のベース
tags:
  - name: health
  - name: users
paths:
  /health:
    get:
      operationId: getHealth
      tags: [health]
      summary: ヘルスチェック
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'

  /users:
    get:
      operationId: getUsers
      tags: [users]
      summary: ユーザー一覧取得（GET → useQuery）
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: perPage
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserList'
    post:
      operationId: createUser
      tags: [users]
      summary: ユーザー作成（write な POST → useMutation）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /users/search:
    post:
      operationId: searchUsers
      tags: [users]
      summary: >
        ユーザー検索（read 用途の POST）。orval.config.ts の per-operation
        override で query 生成へ切り替え、GET と同一の prefetch → hydrate
        経路に乗せる（設計 §3.3.1 / §3.5）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserSearchQuery'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserList'

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string
    User:
      type: object
      required: [id, name, email]
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        createdAt:
          type: string
          format: date-time
    UserList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/User'
        total:
          type: integer
    UserCreateInput:
      type: object
      required: [name, email]
      properties:
        name:
          type: string
        email:
          type: string
          format: email
    UserSearchQuery:
      type: object
      properties:
        keyword:
          type: string
        page:
          type: integer
          minimum: 1
          default: 1
        perPage:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
